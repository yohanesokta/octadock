<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ct-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ded1bf"/>
      <stop offset="100%" stop-color="#cbbbaa"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="25" ry="25"/>
    </clipPath>
    <filter id="bust-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="8" y="8" width="112" height="112" fill="url(#ct-bg)"/>
    
    <!-- User Bust Silhouette -->
    <g filter="url(#bust-shadow)" fill="#4a453f" transform="translate(54,64)">
      <!-- Head -->
      <circle cx="0" cy="-15" r="13"/>
      <!-- Shoulders -->
      <path d="M -28 26 C -28 10 -16 5 0 5 C 16 5 28 10 28 26 Z"/>
    </g>
    
    <!-- Right side index tabs -->
    <g transform="translate(104, 20)">
      <rect x="0" y="0" width="16" height="18" rx="3" fill="#ff3b30"/>
      <rect x="0" y="22" width="16" height="18" rx="3" fill="#ff9500"/>
      <rect x="0" y="44" width="16" height="18" rx="3" fill="#34c759"/>
      <rect x="0" y="66" width="16" height="18" rx="3" fill="#007aff"/>
    </g>
    
    <rect x="8.5" y="8.5" width="111" height="111" rx="24.5" ry="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>