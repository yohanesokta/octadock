<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="set-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e939a"/>
      <stop offset="100%" stop-color="#6c727a"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="25" ry="25"/>
    </clipPath>
    <filter id="gear-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="8" y="8" width="112" height="112" fill="url(#set-bg)"/>
    
    <!-- Metallic gear -->
    <g filter="url(#gear-shadow)" transform="translate(64,64)">
      <circle cx="0" cy="0" r="34" fill="#d2d6dc"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(0)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(45)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(90)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(135)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(180)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(225)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(270)"/>
      <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#d2d6dc" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="24" fill="#7a8088"/>
      <circle cx="0" cy="0" r="13" fill="#e8ecf0"/>
    </g>
    
    <rect x="8.5" y="8.5" width="111" height="111" rx="24.5" ry="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>