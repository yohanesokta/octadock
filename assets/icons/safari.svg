<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="safari-dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16b1ff"/>
      <stop offset="50%" stop-color="#0e75f7"/>
      <stop offset="100%" stop-color="#004bc4"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="25" ry="25"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="8" y="8" width="112" height="112" fill="#ffffff"/>
    
    <!-- Circular Compass Body -->
    <circle cx="64" cy="64" r="50" fill="url(#safari-dial)"/>
    
    <!-- Compass ticks -->
    <g stroke="#ffffff" stroke-opacity="0.8" stroke-linecap="round" transform="translate(64,64)">
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(0)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(15)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(30)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(45)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(60)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(75)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(90)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(105)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(120)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(135)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(150)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(165)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(180)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(195)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(210)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(225)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(240)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(255)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(270)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(285)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(300)"/>
      <line x1="0" y1="-46" x2="0" y2="-40" stroke-width="1.6" transform="rotate(315)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(330)"/>
      <line x1="0" y1="-46" x2="0" y2="-42.5" stroke-width="1.0" transform="rotate(345)"/>
    </g>
    
    <!-- Compass Needle: Red (top-right) and White (bottom-left) pointing at 45 deg -->
    <g transform="translate(64,64) rotate(45)">
      <!-- Top Red Needle -->
      <polygon points="0,-44 7,-4 0,0" fill="#ff3b30"/>
      <polygon points="0,-44 -7,-4 0,0" fill="#e02e24"/>
      <!-- Bottom White Needle -->
      <polygon points="0,44 7,4 0,0" fill="#ffffff"/>
      <polygon points="0,44 -7,4 0,0" fill="#d2d5dc"/>
      <!-- Center Pivot -->
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="#0e75f7"/>
    </g>

    <rect x="8.5" y="8.5" width="111" height="111" rx="24.5" ry="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  </g>
</svg>