<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37d359"/>
      <stop offset="100%" stop-color="#27b346"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="25" ry="25"/>
    </clipPath>
    <filter id="cam-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="8" y="8" width="112" height="112" fill="url(#ft-bg)"/>
    
    <!-- White Camera silhouette -->
    <g filter="url(#cam-shadow)" fill="#ffffff">
      <!-- Main camera body -->
      <rect x="24" y="41" width="54" height="46" rx="11" ry="11"/>
      <!-- Camera lens pointing right -->
      <path d="M 81 53 L 102 39 C 104 38 106 39 106 41 L 106 87 C 106 89 104 90 102 89 L 81 75 Z"/>
    </g>
    
    <rect x="8.5" y="8.5" width="111" height="111" rx="24.5" ry="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>