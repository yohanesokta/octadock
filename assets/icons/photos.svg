<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="25" ry="25"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="8" y="8" width="112" height="112" fill="#ffffff"/>
    
    <!-- 8 Multi-color Flower Petals -->
    <g transform="translate(64,64)">
      <!-- 0 deg: Yellow -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#fbc02d" opacity="0.88" transform="rotate(0)"/>
      <!-- 45 deg: Orange -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#f57c00" opacity="0.88" transform="rotate(45)"/>
      <!-- 90 deg: Red -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#e53935" opacity="0.88" transform="rotate(90)"/>
      <!-- 135 deg: Magenta -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#d81b60" opacity="0.88" transform="rotate(135)"/>
      <!-- 180 deg: Purple -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#8e24aa" opacity="0.88" transform="rotate(180)"/>
      <!-- 225 deg: Blue -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#1e88e5" opacity="0.88" transform="rotate(225)"/>
      <!-- 270 deg: Cyan -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#00acc1" opacity="0.88" transform="rotate(270)"/>
      <!-- 315 deg: Green -->
      <ellipse cx="0" cy="-23" rx="9" ry="19" fill="#43a047" opacity="0.88" transform="rotate(315)"/>
      
      <!-- Flower core -->
      <circle cx="0" cy="0" r="5.5" fill="#ffffff"/>
    </g>
    
    <rect x="8.5" y="8.5" width="111" height="111" rx="24.5" ry="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  </g>
</svg>