<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="msg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38d75b"/>
      <stop offset="100%" stop-color="#2bb84d"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="25" ry="25"/>
    </clipPath>
    <filter id="bubble-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="8" y="8" width="112" height="112" fill="url(#msg-bg)"/>
    
    <!-- Clean white chat bubble -->
    <g filter="url(#bubble-shadow)">
      <path d="M 64 28 C 39 28 20 44 20 63 C 20 73 26 82 36 88 L 33 100 C 32 102 34 104 36 103 L 50 96 C 54 97 59 98 64 98 C 89 98 108 82 108 63 C 108 44 89 28 64 28 Z" fill="#ffffff"/>
    </g>
    
    <rect x="8.5" y="8.5" width="111" height="111" rx="24.5" ry="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  </g>
</svg>